$activeBorderColor = rgba(E8A33Dff)
$activeBorderColorAlt = rgba(8B6F2Bff)
$activeShadowColor = rgba(E8A33D44)
$inactiveBorderColor = rgba(8B6F2B66)
$inactiveShadowColor = rgba(00000000)

general {
    col.active_border = $activeBorderColor $activeBorderColorAlt 45deg
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    shadow {
      enabled = true
      range = 8
      render_power = 3
      color = $activeShadowColor
      color_inactive = $inactiveShadowColor
    }
}
