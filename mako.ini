# Theme: Sun
# Inspired by the Mars theme for Omarchy

text-color=#F5E1A4
border-color=#8B6F2B
background-color=#2A1F0A
width=420
height=110
padding=10
border-size=2
font=Liberation Sans 11
anchor=top-right
outer-margin=20
default-timeout=5000
max-icon-size=32

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
